name: TinyWarp 问题报告
description: 报告终端、菜单、会话、更新或 SSH 等可复现问题。
body:
  - type: markdown
    attributes:
      value: 请先搜索已有问题。不要公开凭据、私人命令或尚未修复的漏洞细节；当前验证平台为 macOS Apple Silicon。
  - type: input
    id: version
    attributes:
      label: TinyWarp 版本与构建号
      description: 在设置的关于页查看。
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS 版本与芯片
      placeholder: 例如 macOS 版本、Apple M 系列芯片。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与复现步骤
      description: 说明从什么状态开始、进行了哪些操作、是否稳定复现。SSH 问题请补充远端系统和 shell。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志
      description: 只附与问题直接相关的片段，先移除凭据、路径和其他私人内容。
