name: TinyWarp 功能建议
description: 说明实际使用需求及希望改善的体验。
body:
  - type: markdown
    attributes:
      value: 请先查看 ROADMAP 和已有讨论。TinyWarp 专注本地终端，首阶段支持 macOS Apple Silicon。
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么使用问题
      description: 说明使用场景、当前行为和受影响的人群。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改善
      description: 可附具体例子、替代做法或设计参考。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充背景
      description: 如涉及其他平台、数据兼容或上游能力，请在这里说明。
