[package]
authors = ["Warp Team <dev@warp.dev>"]
name = "natural_language_detection"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
default = ["word_scoring"]
word_scoring = ["dep:rust-stemmers", "dep:lazy_static", "dep:regex"]

[dependencies]
rust-stemmers = { version = "^1.0", optional = true }
lazy_static = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
